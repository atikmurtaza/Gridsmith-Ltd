# Disposable design simulation only. Not Hostinger deployment configuration.
ServerRoot /etc/apache2
PidFile /proof/httpd.pid
ServerName localhost
Listen 8080
Listen 8081
Listen 8082
Listen 8083
Listen 8084
Listen 8085
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
TypesConfig /etc/mime.types
ErrorLog /proof/error.log
LogLevel warn
ServerTokens Prod
ServerSignature Off
DocumentRoot /proof/site
DirectoryIndex index.html
<Directory /proof/site>
  Require all granted
  AllowOverride FileInfo Options AuthConfig
  Options -Indexes -MultiViews
  DirectorySlash Off
</Directory>
<Directory /proof/fallback>
  Require all granted
  AllowOverride None
  Options -Indexes
</Directory>
Alias /__gs_error.html /proof/fallback/error.html
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
<Location /__gs_error.html>
  Header onsuccess unset Cache-Control
  Header always set Cache-Control "no-store, max-age=0"
  Header always set Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "no-referrer"
  Header always set X-Robots-Tag "noindex, nofollow, noarchive"
  Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=(), browsing-topics=()"
  Header always set Strict-Transport-Security "max-age=31536000"
</Location>
# 8080: file-serving errors, with fallback outside the simulated deployment root.
<VirtualHost *:8080>
  ErrorDocument 500 /__gs_error.html
  RewriteEngine On
  RewriteRule ^/induced-500$ - [R=500,L]
</VirtualHost>
# 8081: document-navigation errors from the actual Next server.
<VirtualHost *:8081>
  ProxyErrorOverride Off
  <If "req('Accept') =~ m#text/html# && req('RSC') != '1' && %{REQUEST_URI} !~ m#^/api(?:/|$)# && (%{REQUEST_METHOD} == 'GET' || %{REQUEST_METHOD} == 'HEAD')">
    ProxyErrorOverride On 500 502 503 504
  </If>
  ProxyPass /__gs_error.html !
  ProxyPass /upstream-unavailable http://127.0.0.1:59999/
  ProxyPass /upstream-502 http://127.0.0.1:8085/502
  ProxyPass /upstream-503 http://127.0.0.1:8085/503
  ProxyPass /upstream-504 http://127.0.0.1:8085/504
  # Synthetic API-path error subject; no application API, database or mail is called.
  ProxyPass /api/gs-launch004-protocol http://host.docker.internal:3349/gridsmith-ssr-throw-probe
  ProxyPass / http://host.docker.internal:3349/
  ProxyPassReverse / http://host.docker.internal:3349/
  ErrorDocument 500 /__gs_error.html
  ErrorDocument 502 /__gs_error.html
  ErrorDocument 503 /__gs_error.html
  ErrorDocument 504 /__gs_error.html
</VirtualHost>
<VirtualHost *:8085>
  RewriteEngine On
  RewriteRule ^/502$ - [R=502,L]
  RewriteRule ^/503$ - [R=503,L]
  RewriteRule ^/504$ - [R=504,L]
</VirtualHost>
# 8082: missing error-document adverse subject; never an accepted recovery path.
<VirtualHost *:8082>
  ErrorDocument 500 /missing-error-document.html
  RewriteEngine On
  RewriteRule ^/induced-500$ - [R=500,L]
</VirtualHost>
# 8083: ordinary file host without any 500 customization.
<VirtualHost *:8083>
  RewriteEngine On
  RewriteRule ^/induced-500$ - [R=500,L]
</VirtualHost>
# 8084: the simple release-root .htaccess alternative, including its failure mode.
<VirtualHost *:8084>
  DocumentRoot /proof/co-located
  <Directory /proof/co-located>
    Require all granted
    AllowOverride All
  </Directory>
</VirtualHost>
